# ruff 配置（仓库自带）
#
# 仓库原来没有 ruff 配置，lint 走的是工具自带的那份严格档（E/W/F/I/B/UP/SIM/
# C4/PIE/S 全开），结果全仓 900+ 处告警——绝大部分是历史代码的风格问题，
# 信号被噪声淹了：真正的新问题（比如导入解析不到）混在里面，没人看。
#
# 这里定的是**这个仓库自己的规矩**：
#
#   - E4/E7/E9  pycodestyle 里真正会咬人的那几条（缩进、空白、语法）
#   - F        pyflakes：未定义的名字、用错的可变默认值、真的没用的导入
#   - I        isort：导入顺序
#
# 不开的：UP（pyupgrade）、SIM、PIE、C4、B、S —— 那是「现代化」口味，不是
# 正确性。历史代码里的 .format()、% 格式化一律保留：它们没有 bug，
# 批量改写只会把 diff 变成噪音，让真正的修复淹没在里面。
#
# 关键的一条是 known-first-party：publishkit、wechat、toutiao 这些包**不在
# site-packages 里**（它们靠 sys.path 挂进仓库），isort 不知道就当成第三方
# 包，导入顺序判错。那一行就是「谁是自己人」。

line-length = 120
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = [
    "publishkit",
    "wechat",
    "toutiao",
    "channels",
    "bilibili",
    "browser",
    "pyv",
    "site_root",
]

[lint.per-file-ignores]
# 测试与工具脚本要在 import 之前改 sys.path（那些包不在 site-packages 里），
# 这是既有纪律，不是疏忽。
"**/tests/**" = ["E402"]
"tools/*.py" = ["E402"]
"weixin/tools/*.py" = ["E402"]
# docs/ 下是**发布内容**（文章里带代码），不是仓库代码：不管它。
"docs/**" = ["ALL"]

[lint.flake8-pytest-style]
fixture-parentheses = false
