# ruff 配置（仓库自带）
#
# 仓库原来没有 ruff 配置，lint 走的是工具自带的那份严格档（E/W/F/I/B/UP/SIM/
# C4/PIE/S 全开），结果全仓 900+ 处告警——绝大部分是历史代码的风格问题，
# 信号被噪声淹了：真正的新问题（比如导入解析不到）混在里面，没人看。
#
# 这里定的是**这个仓库自己的规矩**：只留会咬人的那几条。
#
#   E4  import 位置（模块级 import 不在文件头）
#   E7  语句层面的坑（分号、模糊变量名 l）
#   E9  语法与运行时错误（IOE、缺少 f-string 占位符）
#
# 不开的：UP（pyupgrade）、SIM、PIE、C4、B、S —— 那是「现代化」口味，不是
# 正确性。历史代码里的 .format()、% 格式化一律保留：它们没有 bug，
# 批量改写只会把 diff 变成噪音，让真正的修复淹没在里面。
#
# pyflakes（F）与 isort（I）不开：上游代码在这两处有大量历史债，
# 在「合并上游」这类提交里批量改写会淹没真正的变更。要开就单独开一个
# 提交，那时的 diff 才说得清。

line-length = 88
target-version = "py312"

[lint]
select = ["E4", "E7", "E9"]

[lint.per-file-ignores]
# 测试与工具脚本要在 import 之前改 sys.path（那些包不在 site-packages 里），
# 这是既有纪律，不是疏忽。
"**/tests/**" = ["E402"]
"tools/*.py" = ["E402", "E401", "E702"]
"weixin/tools/*.py" = ["E402", "E401"]
# docs/ 下是**发布内容**（文章里带代码），不是仓库代码：不管它。
"docs/**" = ["ALL"]
