# 个人站点 growdu.cn 的平台能力声明。
#
# 这是**站点第一次被当成第三方平台登记**的地方。在这之前，站点走的是
# 另一条路：docs/ 母稿 → 编译器 → content/units/ → 站点副本 → Astro → dist/，
# 不经能力声明、不经发布清单、不经 outbox 快照。
#
# 现在它跟公众号、头条号、抖音、视频号、B 站住在一个目录下，
# 遵守同一套规矩：目录名即平台 id，能力即数据，发布状态记在 outbox/。
#
# ⚠️ 这一份声明里**故意没有** title_chars / body_chars。
# 站点不吃平台那套限额——标题和正文都不设上限。
# 声明一个数就是许诺一个数：契约层会拿它当闸，超了就判违规。
# 与其编一个「站点的标题上限是 200 字」这种没依据的数字，
# 不如不声明（不声明就不查）。
#
# 数值来源：站点自身的产物实测（2026-11-18，见
# platforms/blog/docs/01-站点即第三方平台.md §4）与
# .github/workflows/site.yml 的构建步骤。

id = "blog"
name = "个人站点 growdu.cn"
kind = "document"

# 站点不需要任何凭据：推上去就重建，没有账号、没有 token。
auth = "none"

# api_publish = 自动发布。
#
# 六个平台里**只有站点是这个档**——它是我们自己的站，发布链路是
# 「push 到 master → CI 构建 → 部署」，全程没有人工参与。别的平台停在这一档以下，
# 是因为**平台那边**的权限或审核拦着，不是我们偷懒。
#
# ⚠️ 声明的是这个平台的**档位**（它没有「逐篇等人点发布」这回事）。
# **部署那一步还没做**：现在的 CI（`.github/workflows/site.yml`）只构建与校验，
# 不往 growdu.cn 推——上线那一轮才接上。接上之前，站点在公网上还是旧版。
automation = "api_publish"

# precheck = 本地预检。
#
# 站点没有「平台机审」这回事（它是我们自己的站），
# 但发布前有一整套本地闸门：
#   site/tools/check-markdown.py  —— 围栏体检（CI 里扫 docs/；本地不带参数时扫 docs/ 与 drafts/）
#   site/tests/                   —— 站点契约测试（学习流归属、死链、页面齐全）
#   tools/build-content-units.py  —— 内容契约与内容单元编译（--check 只查不改）
#   tools/check-content-contract.py —— 内容契约
# 这套闸门就是站点的「平台审核」。
review = "precheck"

requires_certification = false
requires_min_followers = 0

# verified = 这些数值最后对着实测复核过的日期（ISO 日期）。
verified = "2026-11-18"

[limits]
# 站点唯一的媒体限额是**我们自己的取舍**，不是站点的限制：
# 站点的图片随母稿进 git（docs/ 下），构建时按原文件名拷进 public/images/，
# 不做转码——所以这个数字约束的是「**进 git 之前**」，
# 不是「上传到站点时」。
#
# 2 MB 这个数来自旧站点的实测（那时产物有 167 MB / 2400 个文件）。
# 现在站点重做成 Astro（2026-11-18），产物是 693 KB / 66 个文件——
# 体积不再是大头，但**图片进 git 这一点没变**，所以这条约束照旧成立：
# 单张图超过 2 MB，仓库与 CI 传输都要明显变重。
image_bytes = 2097152

[adapter]
# 包目录是 <仓库>/platforms/blog/，命令在 <仓库>/platforms/ 下跑：
# `python3 -m blog.cli status`。
#
# 站点没有 `publish` 子命令：它是**全量构建**（一次 push 重建全站），
# 不是逐篇出包。逐篇的事留给 CI，
# 这里只提供「这个平台是什么」「站上现在是什么样子」「这一篇能不能进站」三个查询。
package = "blog"
command = ["python3", "-m", "blog.cli"]
