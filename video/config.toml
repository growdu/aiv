# 视频线的项目配置
#
# 这份文件是**框架与内容之间那道缝**：流水线本身不认识「小象」也不认识
# 什么曲子，它只认这里声明的位置。换成你自己的素材，改这个文件就行，
# 不用改代码。
#
# 相对路径按**本文件所在目录**（`video/`）解析；绝对路径照用。
# 想在同一个仓库里跑两套片子，用环境变量 `VIDEO_CONFIG` 指到另一份配置。
#
# **素材缺失不是错误。** 没配就是没配：形象不画、品牌片不带、BGM 不铺，
# 流水线照样出片。`make doctor` 会把「配了但文件不在」单独报出来——
# 那是配错了，不是「还没买素材」。

[brand]
# 落版与片尾字幕上的名字
name = "Growdu"
# 品牌词：画面里出现它，就算有品牌标识（审校与换素材的判据）
token = "growdu"
# 片头副标题
tagline = "深入数据库"
# 片尾落版（通常是站点地址）
site = "Growdu.cn"

[assets.mascot]
# 立绘：透明底 PNG。缺了就降级成「不画形象」，不影响出片。
# 换素材也可以不动这里：`make ... render --character <路径>` 临时换。
#
# **默认留空**：立绘是**你自己的**素材，不跟着仓库走。
# 填上相对路径（按本文件所在目录解析）或绝对路径。
image = ""

# 无标牌立绘（可选）。平台判「过度营销信息」时换这份：
#   make EP=<期路径> nobrand NOBADGE=1
# 留空 = 不提供备用。
plain = ""

[assets.avatar]
# 落版头像（可选）。留空 = 落版不带头像。
image = ""

[assets.music]
# 曲库目录：曲子放这里。**不入库**——版权是曲子作者的。
dir = "music/tracks"

# 正文铺底那首（混音必需）。留空 = 不铺 BGM。
bed = ""

# 曲库授权台账。**入库**——它记的是授权事实（每首曲子从哪来、什么授权）。
library = "music/library.json"

[assets.brand]
# 品牌片（片头/片尾 mp4）。目录里的片按 `intro` / `outro` 认。
# 没有这一项 = 成片不带品牌片头片尾。
clips = "brand/clips"

# 品牌成品音轨（`{intro,outro}_mix.wav`）。mp4 里烘焙的音轨只作兜底。
audio = "brand/audio"

# 品牌片头尾的时间窗配置
windows = "brand/brand_windows.json"
