name: Contracts

# 契约闸门：内容契约 + 契约层与各平台 adapter 的测试。
#
# 为什么单独一个工作流，而不是塞进 hexo.yml：
# hexo.yml 是**构建与部署**（push 到 master 就发版），这里是**守约束**
# （内容契约违规 = 构建失败）。两者的触发时机、失败后果、跑的时长都不同，
# 混在一起会让「部署失败」和「约束被破」变成同一件事。
#
# 覆盖范围：
#   - 内容契约（publish/spec/00 §4）：母稿的 front matter 必须满足字段表
#   - 契约层（publish/publishkit）：内容契约、能力模型、发布清单、调度
#   - 头条号 / 公众号 adapter：切片、出包、草稿箱的规则
#   - 母稿 / review 层：审校信号、审校记录、摘要起草
#
# **每个模块一条 step**——测试跟着模块归位之后（见 acceptance/README.md
# 的模块矩阵），验收也按模块拆开：一个模块红，不该挡住别的模块的验收。
# 所以每条测试 step 都带 `if: ${{ !cancelled() }}`——前一条红了，后面的
# 照样跑完，各自报各自的账。
#
# 站点模块由 site-guard.yml 负责（那边还带 `::error::` 注解）；
# 视频线（video）由 video-pipeline.yml 负责——它需要 cairo / ffmpeg / 字体
# 这套系统依赖，容器里装起来比重，且它的失败模式是「渲染不出片」
# 而不是「契约被破」。

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # sync-hexo.py 用 git log 取最早提交时间当文章日期，
          # 浅克隆会让日期算错。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/publish.txt -r requirements/toutiao.txt -r requirements/wechat.txt

      - name: Build content units
        # 内容单元是 sync 的产物，也是契约层与 adapter 真正读的东西。
        # 没有它，adapter 的测试没有语料。
        run: python3 platforms/blog/site/tools/sync-hexo.py

      - name: Adapt content units into the site
        # 站点拿到的那份内容单元副本（source/_posts/）。
        # 微信与头条的 adapter 读的是**站点那份**（图片按「文章目录的上一级」
        # 解析，图片住在站点的 source/images/ 里），所以这一步不能省。
        run: python3 platforms/blog/site/tools/adapt-units.py

      - name: Content contract gate
        # 违规即失败：标题超长、platforms 不是列表、difficulty 越界……
        # 这些以前只有跑发布层才响，现在在流水线上就响。
        run: python3 tools/check-content-contract.py

      - name: 母稿 / review 层测试
        # 根 `tests/`：审校信号、审校记录、摘要起草——母稿层自己的规矩。
        if: ${{ !cancelled() }}
        run: python3 -m pytest tests/ -q

      - name: 契约层测试
        # publish/：读得懂内容单元。
        if: ${{ !cancelled() }}
        run: cd publish && python3 -m pytest tests/ -q

      - name: 头条 adapter 测试
        if: ${{ !cancelled() }}
        run: cd platforms/toutiao && python3 -m pytest tests/ -q

      - name: 微信 adapter 测试
        if: ${{ !cancelled() }}
        run: cd platforms/wechat && python3 -m pytest tests/ -q
